<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESN Porto – GM Minutes Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--  Page wrapper  -->
    <div class="page">
      <div class="card">

        <!-- Logo -->
        <img id="logo" alt="ESN Porto logo" src="logo.png" />

        <!--  Stepper  -->
        <div id="stepper" aria-label="Progress">
          <div class="step active" id="step-1" data-step="1">
            <div class="step-circle">1</div>
            <span class="step-label">Authenticate</span>
          </div>
          <div class="step-connector"></div>
          <div class="step" id="step-2" data-step="2">
            <div class="step-circle">2</div>
            <span class="step-label">Pick Date</span>
          </div>
          <div class="step-connector"></div>
          <div class="step" id="step-3" data-step="3">
            <div class="step-circle">3</div>
            <span class="step-label">Generate</span>
          </div>
        </div>

        <!--  Step 1: Auth  -->
        <section id="section-auth" class="wizard-section active">
          <h2 class="section-title">Sign in to get started</h2>
          <p class="section-desc">Use your existing ESN Porto account. Volunteer or administrator access is checked for every request.</p>
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input id="email" class="form-input" type="email" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input id="password" class="form-input" type="password" autocomplete="current-password" required />
          </div>
          <div class="button-row">
            <button id="auth_button" class="btn btn-primary"><span class="btn-label">Sign in</span></button>
          </div>
        </section>

        <!--  Step 2 + 3: Action  -->
        <section id="section-action" class="wizard-section">
          <p id="agenda-status" class="section-desc" role="status">Checking agenda availability...</p>
          <p class="section-desc">
            Source:
            <a href="https://docs.google.com/spreadsheets/d/10hxz_UfN27ZV4lzKeUQ3vNl78pOixWU_oFo0FrGTOM0/edit?gid=744514008" target="_blank" rel="noreferrer">
              Open GM Agendas Sheet ↗
            </a>
          </p>

          <div class="form-group">
            <label for="gm_day" class="form-label">GM Date</label>
            <select id="gm_day" class="form-input">
              <option value="" disabled selected>Select a GM date...</option>
            </select>
          </div>

          <div class="button-row">
            <button id="generate_button" class="btn btn-primary" disabled>
              <span class="btn-label">Generate Minutes</span>
            </button>
            <button id="redirect_button" class="btn btn-navy" disabled>
              <span class="btn-label">View Result ↗</span>
            </button>
            <button id="signout_button" class="btn btn-navy" type="button">Sign out</button>
          </div>
          <div id="generation-result" aria-live="polite"></div>

        </section>



      </div><!-- /.card -->
    </div><!-- /.page -->

    <!--  Toast container  -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <!-- Scripts -->
    <script src="ui.js"></script>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
